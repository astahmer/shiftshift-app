name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check signing configuration
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$UPDATER_KEY"
      - name: Reserve version and prepare manifests
        id: version
        run: python3 scripts/prepare-release.py
      - uses: actions/setup-node@v4
        if: steps.version.outputs.published != 'true'
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.published != 'true'
        with:
          toolchain: "1.93.0"
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.published != 'true'
        with:
          workspaces: src-tauri
          shared-key: release-universal
      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.published != 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.version.outputs.published != 'true'
      - name: Build universal companion CLI
        if: steps.version.outputs.published != 'true'
        run: |
          pnpm run build
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin shift --target aarch64-apple-darwin
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin shift --target x86_64-apple-darwin
          mkdir -p src-tauri/target/universal-apple-darwin/release
          lipo -create src-tauri/target/aarch64-apple-darwin/release/shift src-tauri/target/x86_64-apple-darwin/release/shift -output src-tauri/target/universal-apple-darwin/release/shift
          lipo src-tauri/target/universal-apple-darwin/release/shift -verify_arch arm64 x86_64
      - uses: tauri-apps/tauri-action@v0
        if: steps.version.outputs.published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ steps.version.outputs.release_id }}
          releaseDraft: true
          includeUpdaterJson: true
          args: --target universal-apple-darwin
      - name: Verify release assets and publish
        if: steps.version.outputs.published != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > /tmp/release-assets.txt
          grep -q '\.dmg$' /tmp/release-assets.txt
          grep -q '\.app\.tar\.gz$' /tmp/release-assets.txt
          grep -q '\.sig$' /tmp/release-assets.txt
          grep -q '^latest.json$' /tmp/release-assets.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
