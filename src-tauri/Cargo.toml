[package]
name = "shiftshift-tauri"
version = "0.1.0"
edition = "2021"
default-run = "shiftshift-tauri"

[lib]
name = "shiftshift_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-notification = "=2.3.3"
window-vibrancy = "=0.8.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "=1.26.0", features = ["v4"] }
chrono = { version = "=0.4.45", features = ["serde"] }
arboard = "=3.6.1"
png = "=0.18.1"
rust-s3 = { version = "=0.37.2", default-features = false, features = ["sync-native-tls"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "=0.5.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-graphics = "=0.25.0"
enigo = "=0.6.1"
