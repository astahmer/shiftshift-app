[package]
name = "shiftshift-tauri"
version = "0.1.0"
edition = "2021"
default-run = "shiftshift-tauri"
license = "MIT"
description = "A quick-capture desktop utility — double-tap Shift to save a note/todo/link/image without leaving what you're doing."
repository = "https://github.com/astahmer/shiftshift-app"

[profile.release]
strip = "symbols"

[profile.release-small]
inherits = "release"
lto = "thin"
codegen-units = 1
opt-level = "s"

[lib]
name = "shiftshift_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-updater = "=2.11.0"
tauri-plugin-process = "=2.3.1"
window-vibrancy = "=0.8.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
uuid = { version = "=1.26.0", features = ["v4"] }
chrono = { version = "=0.4.45", features = ["serde"] }
arboard = "=3.6.1"
png = "=0.18.1"
rust-s3 = { version = "=0.37.2", default-features = false, features = ["sync-native-tls"] }
ureq = "=2.10.1"
# Default features cover all 3 platforms: macOS Keychain, Windows Credential
# Manager, Linux Secret Service (GNOME Keyring/KWallet via D-Bus).
keyring = "=4.2.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "=0.5.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-graphics = "=0.25.0"
enigo = "=0.6.1"
drag = "=2.1.1"
raw-window-handle = "=0.6.2"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", features = ["std", "NSArray", "NSGeometry", "NSString", "NSData"] }
objc2-app-kit = { version = "=0.3.2", features = ["std", "NSEvent", "NSImage", "NSPasteboard", "NSPasteboardItem", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSView", "NSWindow", "NSApplication"] }
