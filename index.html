<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>shiftshift</title>
		<link rel="stylesheet" href="/src/style.css" />
		<style>
			#startup-fallback {
				position: fixed;
				inset: 24px;
				display: flex;
				align-items: center;
				justify-content: center;
				font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				color: #c0caf5;
				background: #1a1b26;
				border: 1px solid #414868;
				border-radius: 12px;
				z-index: 10;
			}

			#startup-fallback[hidden] {
				display: none;
			}

			#startup-fallback > div {
				max-width: 420px;
				text-align: center;
			}

			#startup-fallback strong,
			#startup-fallback span {
				display: block;
			}

			#startup-fallback span {
				margin-top: 8px;
				color: #828bb8;
			}

			#startup-reload {
				margin-top: 16px;
				padding: 6px 10px;
				color: #16161e;
				background: #7aa2f7;
				border: 0;
				border-radius: 6px;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div id="app"></div>
		<div id="startup-fallback" role="alert" hidden>
			<div>
				<strong>ShiftShift could not load its interface.</strong>
				<span>Quit and reopen the app. If this keeps happening, install the latest build.</span>
				<button id="startup-reload" type="button">Reload interface</button>
			</div>
		</div>
		<script>
			(() => {
				const fallback = document.getElementById("startup-fallback");
				const reload = document.getElementById("startup-reload");
				if (!(fallback instanceof HTMLElement) || !(reload instanceof HTMLButtonElement)) return;
				let ready = false;
				const showFallback = () => {
					if (!ready) fallback.hidden = false;
				};
				window.setTimeout(showFallback, 2500);
				window.addEventListener("error", showFallback, { once: true });
				window.addEventListener("unhandledrejection", showFallback, { once: true });
				window.addEventListener("shiftshift-ready", () => {
					ready = true;
					fallback.remove();
				});
				reload.addEventListener("click", () => window.location.reload());
			})();
		</script>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
